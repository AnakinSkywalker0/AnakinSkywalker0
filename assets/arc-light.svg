  <text x="220" y="77" font-family="Georgia,&#x27;Iowan Old Style&#x27;,&#x27;Palatino Linotype&#x27;,&#x27;Times New Roman&#x27;,serif" font-size="14.5" font-style="italic" fill="#6a737d">decides how the body moves</text>
  <text x="0" y="118" font-family="ui-monospace,&#x27;SF Mono&#x27;,&#x27;Cascadia Mono&#x27;,&#x27;Segoe UI Mono&#x27;,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.8" fill="#14171a">HARDWARE</text>
  <circle cx="196" cy="114" r="3.5" fill="#a8552c"/>
  <text x="220" y="119" font-family="Georgia,&#x27;Iowan Old Style&#x27;,&#x27;Palatino Linotype&#x27;,&#x27;Times New Roman&#x27;,serif" font-size="14.5" font-style="italic" fill="#6a737d">does it, and does not ask why</text>
</svg>
