<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="880" height="140" role="img" aria-label="Reflex Arc: a language model reasons about the goal, a learned policy maps state to action, hardware executes the commands">
  <line x1="196" y1="30" x2="196" y2="114" stroke="#e4e5e8" stroke-width="1"/>

  <text x="0" y="34" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#14171a">LANGUAGE MODEL</text>
  <circle cx="196" cy="30" r="3.5" fill="#a8552c"/>
  <text x="220" y="35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#5c6067">reasons about the goal</text>

  <text x="0" y="76" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#14171a">LEARNED POLICY</text>
  <circle cx="196" cy="72" r="3.5" fill="#a8552c"/>
  <text x="220" y="77" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#5c6067">maps state to action</text>

  <text x="0" y="118" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#14171a">HARDWARE</text>
  <circle cx="196" cy="114" r="3.5" fill="#a8552c"/>
  <text x="220" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#5c6067">executes the commands</text>
</svg>
