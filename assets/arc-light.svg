  <line x1="196" y1="30" x2="196" y2="114" stroke="#d7dbe0" stroke-width="1"/>
  <text x="0" y="34" font-family="ui-monospace,&#x27;SF Mono&#x27;,&#x27;Cascadia Mono&#x27;,&#x27;Segoe UI Mono&#x27;,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.8" fill="#14171a">LANGUAGE MODEL</text>
  <circle cx="196" cy="30" r="3.5" fill="#a8552c"/>
  <text x="220" y="35" font-family="Georgia,&#x27;Iowan Old Style&#x27;,&#x27;Palatino Linotype&#x27;,&#x27;Times New Roman&#x27;,serif" font-size="14.5" font-style="italic" fill="#6a737d">decides what is worth doing</text>
  <text x="0" y="76" font-family="ui-monospace,&#x27;SF Mono&#x27;,&#x27;Cascadia Mono&#x27;,&#x27;Segoe UI Mono&#x27;,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.8" fill="#14171a">LEARNED POLICY</text>
