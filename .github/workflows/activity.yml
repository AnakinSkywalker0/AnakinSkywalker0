name: Refresh recent activity

on:
  schedule:
    # 05:17 UTC daily — an odd minute, so it isn't queued behind the hour rush.
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_activity.py"
      - ".github/workflows/activity.yml"

permissions:
  contents: write

concurrency:
  group: refresh-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite the Recently section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python .github/scripts/update_activity.py

      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "README unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh recent activity"
          git push
